<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Local browser-based PDF tools. Files are processed on your device.">
  <title>PDF Tools</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div>
        <h1>PDF Tools</h1>
        <div class="app-caption">Version <span id="app-version">1.0.6</span> <span class="privacy-note">Local processing - files stay on this device</span></div>
      </div>
      <div class="header-actions"><button id="reset-tool" class="button secondary" hidden>Clear PDF and reset function</button></div>
    </header>
    <div class="app-shell">
      <nav class="function-nav" aria-label="PDF functions">
        <div class="nav-heading">Functions</div>
        <button class="nav-button" data-tool="redact">Redact PDF</button>
        <button class="nav-button" data-tool="xlsx">Convert PDF to XLSX</button>
        <button class="nav-button" data-tool="text">Convert PDF to Plain Text</button>
        <button class="nav-button" data-tool="rotate">Rotate PDF</button>
        <button class="nav-button" data-tool="annotate">Annotate PDF</button>
        <button class="nav-button" data-tool="split">Split PDF</button>
        <div class="nav-divider"></div>
        <div id="selected-function" class="selected-function">Select a function to begin.</div>
      </nav>
      <main id="main-content" class="main-content">
        <section class="welcome-state"><h2>Choose a function</h2><p>Select a PDF tool from the navigation panel.</p><p class="privacy-callout">Your PDF is read into browser memory. This application does not upload PDF files to a server.</p></section>
      </main>
    </div>
    <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
